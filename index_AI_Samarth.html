<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Soft Launch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #102E72; /* Fallback background color */
            margin: 0;
        }

        #network-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(125deg, #102E72, #2670C3);
        }

        /* Keyframes for the pulsing button animation */
        @keyframes pulse-button {
            0%   { transform: scale(1); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
            50%  { transform: scale(1.05); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
            100% { transform: scale(1); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        }

        #launch-button {
            animation: pulse-button 2.5s infinite ease-in-out;
            background-color: #FACC15; /* Yellow from your logo */
            color: #102E72; /* Dark blue text for contrast */
        }

        /* NEW: Keyframes for the title fade animation */
        @keyframes title-fade {
            0%   { opacity: 0.3; }
            50%  { opacity: 1; }
            100% { opacity: 0.3; }
        }

        #launch-container h3 {
            /* Apply the new fade animation */
            animation: title-fade 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <canvas id="network-canvas"></canvas>

    <div id="main-container" class="text-center relative z-10">
        <div id="launch-container" class="flex flex-col items-center">
            <h3 class="text-4xl md:text-6xl font-light mb-12 text-white tracking-wide">AI for the Next Generation</h3>
            
            <button id="launch-button" class="font-bold text-2xl py-5 px-12 rounded-full shadow-lg transition duration-300 ease-in-out">
                🚀 Launch
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const launchButton = document.getElementById('launch-button');

            launchButton.addEventListener('click', () => {
                launchButton.disabled = true;
                launchButton.textContent = 'Launching...';
                launchButton.classList.add('opacity-50', 'cursor-not-allowed');
                
                playVideoWithCountdown();
            });

            function enterFullscreen(element) {
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.webkitRequestFullscreen) { /* Safari */
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) { /* IE11 */
                    element.msRequestFullscreen();
                }
            }

            function playVideoWithCountdown() {
                const videoPath = 'samarth_video.mp4'; 

                document.body.innerHTML = `
                    <video 
                        id="final-video-player" 
                        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover;" 
                        autoplay 
                        controls 
                    >
                        <source src="${videoPath}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
                document.body.style.background = '#000';

                const video = document.getElementById('final-video-player');
                const playPromise = video.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        enterFullscreen(video);
                    }).catch(error => {
                        console.error("Autoplay was prevented by the browser:", error);
                    });
                }
            }

            // --- Background Network Animation Script ---
            const canvas = document.getElementById('network-canvas');
            const ctx = canvas.getContext('2d');
            let particlesArray;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
            });

            class Particle {
                constructor(x, y, directionX, directionY, size, color) {
                    this.x = x;
                    this.y = y;
                    this.directionX = directionX;
                    this.directionY = directionY;
                    this.size = size;
                    this.color = color;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                update() {
                    if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                    if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                    this.x += this.directionX;
                    this.y += this.directionY;
                    this.draw();
                }
            }

            function initParticles() {
                particlesArray = [];
                let numberOfParticles = (canvas.height * canvas.width) / 15000;
                for (let i = 0; i < numberOfParticles; i++) {
                    let size = (Math.random() * 2) + 1;
                    let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                    let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                    let directionX = (Math.random() * .4) - .2;
                    let directionY = (Math.random() * .4) - .2;
                    let color = 'rgba(255,255,255,0.5)';
                    particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
                }
            }

            function connect() {
                let opacityValue = 1;
                for (let a = 0; a < particlesArray.length; a++) {
                    for (let b = a; b < particlesArray.length; b++) {
                        let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                        if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                            opacityValue = 1 - (distance / 20000);
                            ctx.strokeStyle = `rgba(255,255,255,${opacityValue})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                for (let i = 0; i < particlesArray.length; i++) {
                    particlesArray[i].update();
                }
                connect();
            }

            resizeCanvas();
            initParticles();
            animate();
        });
    </script>
</body>
</html>
