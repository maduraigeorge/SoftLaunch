<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Soft Launch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: linear-gradient(125deg, #75E8FE, #9FE5C2, #C6C2FA);
            background-size: 400% 400%;
            animation: background-gradient-shift 15s ease infinite alternate;
            position: relative;
            z-index: 0;
        }

        #neural-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @keyframes background-gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: #363187;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #prompt-input {
            width: 350px;
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(54, 49, 135, 0.4);
            background-color: rgba(255, 255, 255, 0.3);
            text-align: center;
            font-size: 1.1rem;
            color: #363187;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease-in-out;
            position: relative;
            z-index: 1;
            animation: prompt-pulse 2s infinite alternate ease-in-out;
        }
        #prompt-input::placeholder { color: rgba(54, 49, 135, 0.5); }

        @keyframes prompt-pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
            100% { transform: scale(1.02); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
        }

        #prompt-input::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400% 400%;
            animation: gradient-shift 8s ease-in-out infinite;
            z-index: -1;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .success { border-color: #22c55e !important; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.4) !important; }
        .error { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.4) !important; }
        @keyframes shake-error { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
        .shake-error { animation: shake-error 0.3s linear; }
    </style>
</head>
<body class="flex items-center justify-center h-screen">

    <canvas id="neural-canvas"></canvas>

    <div id="main-container" class="text-center relative z-10">
        <div id="launch-container" class="flex flex-col items-center">
            <h1 class="text-4xl md:text-6xl font-black mb-8">The Future of AI in Education</h1>
            <form id="prompt-form" class="flex flex-col items-center">
                <input type="text" id="prompt-input" placeholder="Enter a prompt to unveil">
                <button type="submit" class="hidden">Submit</button>
            </form>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const promptForm = document.getElementById('prompt-form');
            const promptInput = document.getElementById('prompt-input');
            
            const canvas = document.getElementById('neural-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particlesArray;

            class Particle {
                constructor(x, y, directionX, directionY, size, color) {
                    this.x = x;
                    this.y = y;
                    this.directionX = directionX;
                    this.directionY = directionY;
                    this.size = size;
                    this.color = color;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                update() {
                    if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                    if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                    this.x += this.directionX;
                    this.y += this.directionY;
                    this.draw();
                }
            }
            
            function init() {
                particlesArray = [];
                let numberOfParticles = (canvas.height * canvas.width) / 9000;
                for (let i = 0; i < numberOfParticles; i++) {
                    let size = (Math.random() * 2) + 1;
                    let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                    let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                    let directionX = (Math.random() * .4) - .2;
                    let directionY = (Math.random() * .4) - .2;
                    // UPDATED: White color with 80% transparency (0.2 opacity)
                    let color = 'rgba(255, 255, 255, 0.2)'; 
                    particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
                }
            }
            
            function connect() {
                let opacityValue = 1;
                for (let a = 0; a < particlesArray.length; a++) {
                    for (let b = a; b < particlesArray.length; b++) {
                        let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) +
                            ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                        if (distance < (canvas.width / 8) * (canvas.height / 8)) {
                            opacityValue = 1 - (distance / 20000);
                            // UPDATED: White line color with dynamic opacity based on 0.2
                            ctx.strokeStyle = `rgba(255, 255, 255, ${opacityValue * 0.2})`; 
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                for (let i = 0; i < particlesArray.length; i++) {
                    particlesArray[i].update();
                }
                connect();
            }
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                init();
            });

            init();
            animate();

            promptForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const promptText = promptInput.value.trim().toLowerCase();
                const validKeywords = ["unveil", "launch", "release", "open"];

                if (validKeywords.some(k => promptText.includes(k))) {
                    promptInput.classList.add('success');
                    promptInput.disabled = true;
                    playVideoWithCountdown();
                } else {
                    promptInput.classList.add('error', 'shake-error');
                    setTimeout(() => {
                        promptInput.classList.remove('error', 'shake-error');
                        promptInput.value = '';
                    }, 500);
                }
            });

            function enterFullscreen(element) {
                if (element.requestFullscreen) element.requestFullscreen();
                else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
                else if (element.msRequestFullscreen) element.msRequestFullscreen();
            }

            function playVideoWithCountdown() {
                const videoPath = 'Chrysalis_AI_video.mp4'; 

                document.body.innerHTML = `
                    <video 
                        id="final-video-player" 
                        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover;" 
                        autoplay 
                        controls 
                    >
                        <source src="${videoPath}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
                document.body.style.background = '#000';

                const video = document.getElementById('final-video-player');
                const playPromise = video.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => enterFullscreen(video))
                               .catch(error => console.error("Autoplay was prevented by the browser:", error));
                }
            }
        });
    </script>
</body>
</html>
